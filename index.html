<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP STUDIO · 앱 기획</title>
<style>
:root{
  --ink:#0f172a;--ink2:#1e293b;--sub:#64748b;--mute:#94a3b8;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--soft:#f8fafc;
  --pri:#4f46e5;--pri-d:#4338ca;--pri-soft:#eef2ff;--ok:#059669;
  --ev:#b45309;--ev-bg:#fef3c7;--ev-bd:#f59e0b;--ac:#6d28d9;--ac-bg:#ede9fe;--ac-bd:#8b5cf6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
svg{display:block;flex:none}

/* 상단 */
.top{background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;color:#fff}
.brand b{display:block;font-size:16px;letter-spacing:2px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--mute)}
.steps{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.dot{height:44px;border-radius:10px;border:none;background:transparent;color:var(--mute);font-weight:600;padding:0 9px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.dot .n{width:24px;height:24px;border-radius:12px;border:1.5px solid #475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dot.done{color:#cbd5e1}
.dot.done .n{background:#334155;border-color:#334155;color:#fff}
.dot.on{background:var(--ink2);color:#fff}
.dot.on .n{background:var(--pri);border-color:var(--pri);color:#fff}
.dot:disabled{opacity:.45;cursor:default}
@media(max-width:1240px){.dot:not(.on) .lb{display:none}}
@media(max-width:640px){.dot .lb{display:none}.steps{margin-left:0}.dot{padding:0 5px}}

/* 본문 */
main{max-width:1200px;margin:0 auto;padding:24px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
@media(max-width:520px){.panel{padding:18px}}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--pri)}
h2{font-size:25px;font-weight:800;margin:6px 0 6px;letter-spacing:-.5px}
.desc{color:var(--sub);margin:0 0 22px;font-size:15.5px}
.tip{display:flex;gap:10px;background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:10px;padding:12px 14px;font-size:14.5px;margin-top:22px;color:var(--ink2)}
.tip svg{color:var(--pri);margin-top:2px}
.sub-title{font-weight:700;font-size:15px;margin:24px 0 10px;color:var(--ink2)}
.grp{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--sub);margin:18px 0 8px;text-transform:uppercase}
.grp:first-of-type{margin-top:0}

/* 선택 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.chip{min-height:64px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.chip:hover{border-color:#cbd5e1}
.ibox{width:40px;height:40px;border-radius:10px;background:#f1f5f9;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.chip b{display:block;font-size:15px;font-weight:700}
.chip small{display:block;color:var(--sub);font-size:12.5px;line-height:1.35}
.chip.sel{border-color:var(--pri);background:var(--pri-soft)}
.chip.sel .ibox{background:var(--pri);color:#fff}
.chip.etc{border-style:dashed}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;border:1.5px solid var(--line);border-radius:22px;background:#fff;padding:6px 16px;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;text-align:left}
.pill.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d);font-weight:700}
.etcbox{margin-top:14px;padding:14px;border:1.5px dashed #c7d2fe;border-radius:12px;background:var(--pri-soft)}
.etcbox .field{margin-bottom:0}

/* 기능 카드 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.fcard{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:left;min-height:124px;display:flex;flex-direction:column;gap:5px;position:relative;transition:border-color .15s,background .15s}
.fcard:hover{border-color:#cbd5e1}
.fcard b{font-size:15px;margin-top:2px}
.fcard .comp{font-size:12.5px;color:var(--sub)}
.fcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-top:auto}
.fcard .tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:600;background:#fff}
.lv{display:flex;gap:3px;align-items:center}
.lv i{width:14px;height:5px;border-radius:3px;background:#e2e8f0}
.lv i.f{background:var(--ink2)}
.fcard .ck{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:12px;background:var(--pri);color:#fff;display:none;align-items:center;justify-content:center}
.fcard.sel{border-color:var(--pri);background:var(--pri-soft)}
.fcard.sel .ibox{background:var(--pri);color:#fff}
.fcard.sel .ck{display:flex}
.fcard.etc{border-style:dashed}
.badge{font-size:11px;font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:1px 6px;letter-spacing:.5px}

/* 입력 */
.field{display:block;font-weight:700;font-size:14.5px;margin-bottom:16px;color:var(--ink2)}
.field input{display:block;width:100%;margin-top:6px;height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:17px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.mini{font-size:13px;color:var(--sub);margin:4px 0 8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}

/* 사용 장면 */
.scene{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
@media(max-width:700px){.scene{grid-template-columns:1fr}.scene .arr{transform:rotate(90deg);justify-self:center}}
.sbox{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)}
.sbox.after{background:var(--pri-soft);border-color:#c7d2fe}
.sbox h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.sbox p{margin:0 0 10px;font-size:13px;color:var(--sub)}
.sbox input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff;outline:none}
.sbox input:focus{border-color:var(--pri)}
.sbox .pills{margin-top:10px}
.sbox .pill{min-height:38px;font-size:13.5px;padding:4px 12px}
.arr{align-self:center;color:var(--mute)}

/* 작동 규칙(블록) */
.rule{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.blk{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 6px 6px 12px;border:1.5px solid}
.blk span{font-size:13px;font-weight:800;flex:none}
.blk input{flex:1;min-width:0;height:44px;border:1px solid transparent;border-radius:8px;padding:0 10px;font-size:15.5px;background:#fff;outline:none}
.blk input:focus{border-color:currentColor}
.blk.when{background:var(--ev-bg);border-color:var(--ev-bd);color:var(--ev)}
.blk.then{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac)}
.blk input{color:var(--ink)}
.rule .arr{color:var(--sub)}
.rule .no{width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.exrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.exrow{grid-template-columns:1fr}}
.exrow h5{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.exrow .pill{min-height:38px;font-size:13.5px;padding:4px 12px}
.exrow .when-ex .pill:hover{border-color:var(--ev-bd)}
.exrow .then-ex .pill:hover{border-color:var(--ac-bd)}
.dotw{width:10px;height:10px;border-radius:3px;background:var(--ev-bd)}
.dott{width:10px;height:10px;border-radius:3px;background:var(--ac-bd)}

/* 오리엔테이션 */
h2.hero{font-size:30px;line-height:1.3;margin:8px 0 12px}
h2.hero span{color:var(--pri)}
.desc.lead{font-size:16px;color:var(--ink2);max-width:640px}
.vtag{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.5px;border-radius:6px;padding:2px 8px;background:var(--pri);color:#fff;flex:none}
.vtag.v2{background:#fff;color:var(--sub);border:1.5px dashed #94a3b8}
.vers{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media(max-width:700px){.vers{grid-template-columns:1fr}}
.ver{border-radius:14px;padding:16px 18px}
.ver.v1c{background:var(--pri-soft);border:1.5px solid #c7d2fe}
.ver.v2c{background:var(--soft);border:1.5px dashed #cbd5e1}
.vtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:15px}
.ver ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ver li{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink2)}
.ver.v1c li svg{color:var(--pri)}
.ver.v2c li{color:var(--sub)}
.exlist{display:flex;flex-direction:column;gap:8px}
.exitem{display:grid;grid-template-columns:190px 1fr 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
@media(max-width:760px){.exitem{grid-template-columns:1fr}}
.exname{display:flex;align-items:center;gap:10px;font-size:14.5px}
.exname .ibox{width:34px;height:34px}
.exv{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink2)}
.exv.dim{color:var(--sub)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.phases{grid-template-columns:1fr}}
.phase{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.phase .pn{width:30px;height:30px;border-radius:15px;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.phase b{display:block;font-size:15px}
.phase small{display:block;font-size:12.5px;color:var(--sub)}
.v2box{margin-top:24px;border:1.5px dashed #cbd5e1;border-radius:14px;padding:16px;background:var(--soft)}
.v2head{display:flex;align-items:center;gap:10px;font-size:15px}
.v2head small{color:var(--mute);font-size:12.5px}
.v2box p{margin:6px 0 10px;font-size:13.5px;color:var(--sub)}
.v2box input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:16px;background:#fff;outline:none}
.v2box input:focus{border-color:var(--pri)}

/* 이름표 */
.idcard{border-radius:16px;background:linear-gradient(155deg,#1e293b,#0f172a);color:#fff;padding:22px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(15,23,42,.18)}
.idcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pri)}
.idcard .co{font-size:12px;letter-spacing:2px;font-weight:700;color:#a5b4fc}
.idcard .face{width:64px;height:64px;border-radius:14px;background:#334155;display:flex;align-items:center;justify-content:center;margin:18px 0 14px;color:#cbd5e1}
.idcard .role{font-size:11px;letter-spacing:1.2px;color:var(--mute);font-weight:700}
.idcard .nm{font-size:24px;font-weight:800;margin-top:2px;word-break:break-all}
.idcard .tm{font-size:14px;color:#cbd5e1;word-break:break-all;margin-top:2px}
.idcard .bar{margin-top:18px;height:26px;border-radius:4px;background:repeating-linear-gradient(90deg,#475569 0 2px,transparent 2px 5px,#475569 5px 6px,transparent 6px 9px);opacity:.6}

/* 아이콘·색 */
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.embtn{height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:.15s;font-size:12px;font-weight:700;flex-direction:column;gap:2px}
.embtn.sel{border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(15,23,42,.18)}
.embtn.draw{border-style:dashed;color:var(--pri)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.cbtn{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.cbtn.sel{box-shadow:0 0 0 2.5px var(--ink)}
.sentence{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:14px 16px;font-size:16px;font-weight:600}

/* 그리기 패드 */
.padwrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:12px}
.padtools{display:flex;flex-direction:column;gap:12px;min-width:200px;flex:1}
.ptrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ptrow label{font-size:12px;font-weight:700;color:var(--sub);width:100%}
.pcol{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.pcol.on{box-shadow:0 0 0 2.5px var(--ink)}
.psz,.ptool{min-width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.psz.on,.ptool.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-d)}
.psz i{display:block;border-radius:50%;background:currentColor}
.padstage{border-radius:22px;overflow:hidden;border:1.5px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(15,23,42,.08);width:300px;max-width:100%}
.padbar{color:#fff;font-weight:700;font-size:14px;padding:10px 14px;display:flex;align-items:center;gap:8px}
#pad{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background-color:#fff;background-image:radial-gradient(#e2e8f0 1.2px,transparent 1.2px);background-size:20px 20px}
.padstage.icon{width:190px;border-radius:44px;border:none}
.padstage.icon #pad{background-image:none;background-color:transparent}

/* 화면 설계 */
.mtabs{display:inline-flex;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:16px}
.mtab{min-height:44px;border:none;background:transparent;border-radius:9px;padding:0 18px;font-weight:700;font-size:14.5px;color:var(--sub);display:inline-flex;align-items:center;gap:8px}
.mtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{min-height:46px;border:1.5px dashed #cbd5e1;border-radius:10px;background:#fff;padding:6px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.pbtn small{font-weight:500;color:var(--sub)}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--soft)}
.pitem .no{width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.pitem .ty{display:flex;align-items:center;gap:8px;font-weight:700;min-width:104px;font-size:14.5px}
.pitem .ty small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.pitem input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font-size:15.5px;background:#fff;outline:none}
.pitem input:focus{border-color:var(--pri)}
.pitem .noin{flex:1;color:var(--mute);font-size:13.5px}
.ibtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:disabled{opacity:.3}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:14.5px}
.linkbtn{min-height:44px;border:1px solid #c7d2fe;background:var(--pri-soft);color:var(--pri-d);font-weight:700;border-radius:10px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px}

/* 셀프 체크 & 결과 */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.checks{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px 14px;text-align:left;font-size:15px}
.check .box{width:26px;height:26px;border-radius:7px;border:1.5px solid #cbd5e1;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.check.sel{border-color:var(--ok);background:#ecfdf5}
.check.sel .box{background:var(--ok);border-color:var(--ok)}
.script{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.75}
#planImg{width:100%;max-width:540px;display:block;margin:12px auto 0;border-radius:12px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.10)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

/* 폰 미리보기 */
.side{position:sticky;top:16px}
@media(max-width:900px){.side{position:static}}
.phoneWrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:268px;height:528px;border-radius:40px;background:var(--ink);padding:10px;box-shadow:0 18px 40px rgba(15,23,42,.22)}
.screen{width:100%;height:100%;border-radius:31px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.sbar{height:28px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 20px;flex:none}
.bat{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.home{background:linear-gradient(170deg,#e0e7ff,#f8fafc 60%,#e2e8f0);flex:1;display:flex;flex-direction:column}
.home .sbar{color:var(--ink)}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:22px 14px}
.happ{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--sub);text-align:center}
.happ i{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--mute);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.mine{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.mine i{width:88px;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 22px rgba(15,23,42,.22);overflow:hidden}
.mine i img{width:100%;height:100%;display:block}
.mine i.blank{background:#fff;color:#cbd5e1;border:2px dashed #cbd5e1;box-shadow:none}
.mine span{font-weight:700;font-size:14px;color:var(--ink);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appv{flex:1;display:flex;flex-direction:column;min-height:0}
.appv .sbar{color:#fff}
.tbar{color:#fff;font-weight:700;font-size:15px;padding:4px 16px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;display:flex;align-items:center;gap:8px}
.tbar img{width:20px;height:20px;border-radius:5px}
.abody{flex:1;overflow:hidden;padding:14px;display:flex;flex-direction:column;gap:9px;align-items:center;background:#fff}
.abody.sk{padding:0}
.abody.sk img{width:100%;display:block}
.p-label{font-size:13.5px;font-weight:600;text-align:center;word-break:break-all;color:var(--ink)}
.p-image{width:100%;height:90px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.p-button{padding:9px 20px;border-radius:9px;color:#fff;font-weight:700;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.p-textbox{width:100%;border:1.5px solid #cbd5e1;border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.p-canvas{width:100%;height:110px;border:1.5px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.p-check{width:100%;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.p-check i{width:16px;height:16px;border:1.5px solid #94a3b8;border-radius:4px;flex:none}
.p-list{width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.p-list div{height:24px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px}
.p-list div:last-child{border:none}
.p-list div i{height:6px;border-radius:3px;background:#e2e8f0;width:60%}
.p-slider{width:100%;height:20px;position:relative;flex:none}
.p-slider::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:#e2e8f0}
.p-slider i{position:absolute;left:40%;top:2px;width:16px;height:16px;border-radius:50%}
.pempty{color:var(--mute);font-size:12.5px;text-align:center;margin-top:60px;padding:0 10px}
.ptabs{display:flex;background:#e2e8f0;border-radius:10px;padding:3px}
.ptab{min-height:40px;border:none;background:transparent;border-radius:8px;padding:0 16px;font-weight:700;font-size:13.5px;color:var(--sub)}
.ptab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.pcap{font-size:12.5px;color:var(--sub);text-align:center}

/* 하단 내비 */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:5}
.nav .hint{flex:1;text-align:center;font-size:14px;color:var(--sub)}
.nav .hint.warn{color:#dc2626;font-weight:700}
.btn{min-height:52px;padding:0 22px;border-radius:12px;font-weight:700;font-size:16px;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.pri.off{background:#a5b4fc}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.hide{visibility:hidden}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #planImg{visibility:visible;position:absolute;left:0;top:0;width:100%;max-width:none;box-shadow:none;border:none;border-radius:0;margin:0}
}
</style>
</head>

function hasBatchim(w){const t=String(w||'').trim();if(!t)return null;const c=t.charCodeAt(t.length-1);if(c<0xAC00||c>0xD7A3)return null;return (c-0xAC00)%28!==0}

    case 5:if(!S.features.length)return '기능을 1개 이상 골라 주세요';

      return S.main?'':'핵심 기능을 하나 골라 주세요';
    case 6:{const r=S.rules[0];return r&&r.when.trim()&&r.then.trim()?'':'첫 번째 규칙의 ‘언제’와 ‘그러면’을 채워 주세요'}
    case 7:if(!S.appName.trim())return '앱 이름을 지어 주세요';

function mountPad(){
  const cv=$('#pad');if(!cv){pad=null;return}
  const kind=cv.dataset.kind,ctx=cv.getContext('2d');
  pad={cv,ctx,kind,hist:[],drawing:false,last:null};
  if(S[kind]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=S[kind]}
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  const stroke=(a,b)=>{const t=PAD_CFG[kind].tool;ctx.globalCompositeOperation=t.erase?'destination-out':'source-over';
    ctx.strokeStyle=t.color;ctx.lineWidth=t.erase?t.size*2.2:t.size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x+.01,b.y+.01);ctx.stroke()};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
    pad.hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(pad.hist.length>25)pad.hist.shift();
    pad.drawing=true;pad.last=pos(e);stroke(pad.last,pad.last)});
  cv.addEventListener('pointermove',e=>{if(!pad.drawing)return;const p=pos(e);stroke(pad.last,p);pad.last=p});
  const end=()=>{if(!pad.drawing)return;pad.drawing=false;padSave()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
}
function padSave(){
  if(!pad)return;
  const blank=!pad.ctx.getImageData(0,0,pad.cv.width,pad.cv.height).data.some((v,i)=>i%4===3&&v>0);
  S[pad.kind]=blank?'':pad.cv.toDataURL('image/png');
  live();
}
function refreshPadTools(){ // 그림을 지우지 않도록 도구 버튼 표시만 바꿈
  if(!pad)return;const t=PAD_CFG[pad.kind].tool;
  document.querySelectorAll('.pcol').forEach(b=>b.classList.toggle('on',!t.erase&&b.dataset.v===t.color));
  document.querySelectorAll('.psz').forEach(b=>b.classList.toggle('on',+b.dataset.v===t.size));
  const er=document.querySelector('[data-act="padErase"]');if(er)er.classList.toggle('on',t.erase);
}

    {ic:'smile',name:'기분 전환 버튼',v1:'폰을 흔들면 웃긴 소리와 사진이 나와요',v2:'친구와 점수 대결을 해요'}];

    <p class="desc lead">여러분은 오늘부터 앱 회사의 신입 개발자예요. 진짜 개발자들은 큰 아이디어를 한 번에 만들지 않아요.
      <b>꼭 필요한 기능만 담은 첫 번째 버전(1.0)</b>을 먼저 만들어 사람들에게 써 보게 하고, 조금씩 키워 나가요.</p>
    <div class="vers">
      <div class="ver v1c"><div class="vtop"><span class="vtag">v1.0</span><b>오늘 기획하고, 다음 시간에 직접 만들어요</b></div>
        <ul><li>${ic('users',16)}<span>누군가에게 <b>실제로 도움이 되는</b> 앱</span></li>
          <li>${ic('book',16)}<span>수업 때 <b>배운 기능</b>으로 만들 수 있는 앱</span></li>
          <li>${ic('button',16)}<span>버튼 몇 개로 움직이는 <b>작은</b> 앱</span></li></ul></div>
      <div class="ver v2c"><div class="vtop"><span class="vtag v2">v2.0</span><b>나중에 키울 꿈의 기능</b></div>
        <ul><li>${ic('sparkles',16)}<span>아직 배우지 않은 기능</span></li>
          <li>${ic('star',16)}<span>더 크고 멋진 아이디어</span></li>
          <li>${ic('save',16)}<span>버리지 말고 기획서에 적어 둬요</span></li></ul></div>
    </div>
    <div class="sub-title">이렇게 나눠 생각해요</div>
    <div class="exlist">${ex.map(e=>`<div class="exitem">
      <div class="exname"><span class="ibox">${ic(e.ic,18)}</span><b>${e.name}</b></div>
      <div class="exv"><span class="vtag">v1.0</span>${e.v1}</div>
      <div class="exv dim"><span class="vtag v2">v2.0</span>${e.v2}</div></div>`).join('')}</div>
    <div class="sub-title">미션 순서 · 약 30분</div>
    <div class="phases">${phases.map(p=>`<div class="phase"><span class="pn">${p[0]}</span><div><b>${p[1]}</b><small>${p[2]}</small></div></div>`).join('')}</div>
    ${tip('정답은 없어요. <b>“누가, 언제 불편할까?”</b>를 떠올리는 것부터 시작해요. 다 만든 기획서는 이미지로 저장해 패들렛에 올려요.')}`;
}

function panelHTML(){

  if(s===1)return `
    ${eyebrow(1,'이름표')}
    <h2>개발자 이름표 만들기</h2>
    <p class="desc">오늘 여러분은 앱을 기획하는 개발자예요. 먼저 내 이름표부터 만들어요.</p>
    <div class="two">
      <div>
        <label class="field">개발자 이름 (내 이름)
          <input data-field="nick" maxlength="10" placeholder="예) 김제주" value="${esc(S.nick)}"></label>
        <div class="mini">이번 프로젝트는 한 사람이 처음부터 끝까지 만드는 <b>개인 프로젝트</b>예요.</div>
      </div>
      <div class="idcard" id="idcard">${idcardHTML()}</div>
    </div>
    ${tip('완성한 기획서는 <b>발표 자료</b>로 패들렛에 올려요. 누구의 앱인지 알 수 있게 <b>내 이름</b>을 정확히 써 주세요.')}`;

  if(s===2)return `
    ${eyebrow(2,'개발 목적')}
    <h2>어떤 앱을 만드는 개발자인가요?</h2>
    <p class="desc">“나는 사람들을 <b>○○</b> 만드는 앱을 만들 거예요.” 빈칸에 들어갈 말을 골라요. 마음에 드는 게 없으면 <b>직접 쓰기</b>를 눌러요.</p>
    <div class="grid">${PURPOSES.map(p=>chip('purpose',p,S.purpose===p.id,p.desc)).join('')}</div>
    ${S.purpose==='custom'?`<div class="etcbox"><label class="field">사람들을 ______ 만드는 앱
      <input data-field="purposeCustom" maxlength="14" placeholder="예) 웃게, 친해지게, 꿈꾸게" value="${esc(S.purposeCustom)}"></label></div>`:''}
    ${tip('좋은 앱은 <b>왜 만드는지</b>가 분명해요. 내 앱을 쓴 사람이 어떤 표정을 지으면 좋을지 떠올려 보세요.')}`;

  if(s===3){const t=T();return `
    ${eyebrow(3,'사용자')}
    <h2>누구를 위한 앱인가요?</h2>
    <p class="desc">앱을 쓸 사람을 <b>딱 한 명(한 무리)</b> 정하고, 그 사람이 언제 불편한지 생각해요.</p>
    <div class="grid">${TARGETS.map(x=>chip('target',x,S.target===x.id)).join('')}</div>
    ${S.target==='custom'?`<div class="etcbox"><label class="field">앱을 쓸 사람
      <input data-field="targetCustom" maxlength="14" placeholder="예) 축구부 친구들, 이웃 할머니" value="${esc(S.targetCustom)}"></label></div>`:''}
    ${t?`<div class="sub-title" id="probTitle">${esc(targetName()||'그 사람')}은(는) 언제 불편할까요?</div>
      <label class="field" style="margin-bottom:8px"><input data-field="problem" maxlength="30" placeholder="직접 적거나 아래 예시를 눌러요 (예: 약 먹을 시간을 잊을 때)" value="${esc(S.problem)}"></label>
      <div class="mini">‘~할 때’로 끝나게 써 보세요. 예시를 누른 뒤 고쳐 써도 돼요.</div>
      <div class="pills">${t.ex.map(e=>`<button class="pill ${S.problem===e?'sel':''}" data-act="problem" data-v="${esc(e)}">${e}</button>`).join('')}</div>`:''}
    ${tip('실제 개발자도 <b>“누가, 언제 불편한가?”</b>부터 찾아요. 그 사람 입장이 되어 하루를 떠올려 보세요.')}`}

  if(s===4)return `

    <p class="desc"><b>${esc(targetName()||'사용자')}</b>의 하루를 상상해요. 앱이 없을 때와 있을 때를 비교해 보세요.</p>
    <div class="scene">
      <div class="sbox"><h4>${ic('cloud',18)}앱이 없을 때</h4><p>지금은 어떻게 하고 있나요? 무엇이 힘든가요?</p>
        <input data-field="before" maxlength="40" placeholder="예) 알람을 맞춰도 자꾸 잊어버려요" value="${esc(S.before)}">
        <div class="pills">${BEFORE_EX.map(e=>`<button class="pill ${S.before===e?'sel':''}" data-act="before" data-v="${esc(e)}">${e}</button>`).join('')}</div></div>
      <div class="arr">${ic('arrowR',28,2)}</div>

  if(s===5){const sel=S.features;return `
    ${eyebrow(5,'기능')}

    ${FEATURE_GROUPS.map(g=>`<div class="grp">${g.name}</div><div class="fgrid">${g.items.map(f=>`

        <span class="ck">${ic('check',14,3)}</span><span class="ibox">${ic(f.ic)}</span>
        <b>${f.name}</b><span class="comp">부품: ${f.comp}</span>

    <div class="v2box">

      <p>목록에 없는 기능이나 더 큰 아이디어는 버리지 말고 여기에 적어 두세요. 실제 개발자들도 다음 버전에 넣을 기능을 이렇게 모아 둬요.</p>
      <input data-field="v2" maxlength="30" placeholder="예) 정해진 시간이 되면 저절로 알려 주기" value="${esc(S.v2)}">
    </div>
    ${tip('카드 아래 <b>실습 1·2·3</b> 표시는 수업 때 만든 앱이에요. 그때 만든 블록을 떠올리면 쉽게 만들 수 있어요. 난이도 막대가 길수록 어려운 기능이에요.')}`}

  if(s===6)return `
    ${eyebrow(6,'작동 규칙')}
    <h2>앱은 어떻게 움직일까요?</h2>
    <p class="desc">앱인벤터 블록처럼 <b>“언제 → 그러면”</b>으로 앱이 움직이는 규칙을 만들어요. 핵심 기능 <b>${esc((F(S.main)||{}).name||'')}</b>부터 시작해요.</p>
    ${S.rules.map((r,i)=>`<div class="rule">
      <span class="no">${i+1}</span>
      <div class="blk when"><span>언제</span><input data-field="rwhen" data-i="${i}" maxlength="24" placeholder="직접 입력 (예: 버튼을 누르면)" value="${esc(r.when)}"></div>

        <button class="pill" style="border-style:dashed" data-act="thenOwn">${ic('pencil',15)}직접 쓰기</button></div></div>
    </div>
    <div class="mini" style="margin-top:12px">원하는 예시가 없으면 <b>직접 쓰기</b>를 누르거나, 위의 노란·보라 칸에 바로 적어도 돼요. 예시를 넣은 뒤 고쳐 써도 좋아요.</div>
    ${tip('앱인벤터 블록 화면의 <b>“언제 버튼1.클릭했을 때 → 실행”</b>이 바로 이 규칙이에요. 다음 시간에 이 규칙을 블록으로 바꿔요.')}`;

  if(s===8)return `
    ${eyebrow(8,'화면 설계')}
    <h2>앱 화면 설계하기</h2>
    <p class="desc">부품을 쌓아서 설계하거나, 손으로 <b>직접 그려도</b> 돼요. 기획서에는 지금 고른 방식의 화면이 들어가요.</p>

    ${tip('다음 시간에 이 순서 그대로 앱인벤터 <b>디자이너 화면</b>에 부품을 배치해요. 이 화면이 설계도예요.')}`}`;

  return `
    ${eyebrow(9,'기획서')}
    <h2>나의 앱 기획서</h2>
    <p class="desc">스스로 점검하고, 발표 대본으로 친구에게 내 앱을 소개한 뒤 기획서를 패들렛에 올려요.</p>

      pad.hist.push(pad.ctx.getImageData(0,0,pad.cv.width,pad.cv.height));pad.ctx.clearRect(0,0,pad.cv.width,pad.cv.height);padSave()}return;
    case 'addPart':
      if(S.parts.length>=7){toast('부품은 7개까지 넣을 수 있어요');return}
      S.parts.push({type:v,text:PARTS[v].def||''});break;

      if(!S.features.length){toast('5단계에서 기능을 먼저 골라 주세요');return}
      if(S.parts.length&&!confirm('지금 화면을 추천 배치로 바꿀까요?'))return;
      const order=[S.main,...S.features.filter(x=>x!==S.main)];
      const list=[{type:'label',text:(S.appName.trim()||'내 앱')+'에 어서 와요'}];
      order.forEach(id=>{const rec=id==='custom'?[['button',S.customFeature.trim()||'실행']]:(RECOMMEND[id]||[]);
        rec.forEach(([t,tx])=>{if(!list.some(p=>p.type===t&&p.text===(tx||'')))list.push({type:t,text:tx||''})})});

    case 'up':if(i>0)[S.parts[i-1],S.parts[i]]=[S.parts[i],S.parts[i-1]];break;
    case 'down':if(i<S.parts.length-1)[S.parts[i+1],S.parts[i]]=[S.parts[i],S.parts[i+1]];break;

  }

});

const iconCache={};
function loadIcon(name,color,sw=2){
  const k=name+color+sw;
  if(!iconCache[k])iconCache[k]=new Promise(res=>{
    const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[name]||''}</svg>`);
  });
  return iconCache[k];
}
const loadData=u=>new Promise(r=>{if(!u)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=u});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,maxW,maxLines){
  const words=String(text).split(' '),lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(c.measureText(t).width<=maxW){cur=t;continue}
    if(cur){lines.push(cur);cur=''}
    if(c.measureText(w).width<=maxW){cur=w}
    else{for(const ch of Array.from(w)){if(c.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch}else cur+=ch}}
  }
  if(cur)lines.push(cur);
  if(maxLines&&lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.$/,'…')}
  return lines;
}
function fit(c,text,maxW){let t=String(text);if(c.measureText(t).width<=maxW)return t;while(t.length&&c.measureText(t+'…').width>maxW)t=Array.from(t).slice(0,-1).join('');return t+'…'}

      if(pt.type==='checkbox'){c.strokeStyle='#94a3b8';c.lineWidth=2.5;rr(c,cx,cy+8,24,24,5);c.stroke();
        c.fillStyle=ink;c.font=`500 22px ${FONT}`;c.textAlign='left';c.fillText(fit(c,pt.text,cw-40),cx+36,cy+20);c.textAlign='center'}
      if(pt.type==='list'){c.strokeStyle='#e2e8f0';c.lineWidth=2;rr(c,cx,cy,cw,h,10);c.stroke();
        [0,1,2].forEach(k=>{if(k)c.fillRect(cx,cy+k*36,cw,0);c.fillStyle='#e2e8f0';rr(c,cx+14,cy+k*36+14,cw*[.6,.45,.7][k],8,4);c.fill();
          if(k){c.fillStyle='#e2e8f0';c.fillRect(cx,cy+k*36,cw,2)}})}
      if(pt.type==='slider'){c.fillStyle='#e2e8f0';rr(c,cx,cy+12,cw,6,3);c.fill();c.fillStyle=col;c.beginPath();c.arc(cx+cw*.4,cy+15,12,0,Math.PI*2);c.fill()}
      if(pt.type==='canvas'){c.strokeStyle='#cbd5e1';c.lineWidth=2.5;c.setLineDash([10,8]);rr(c,cx,cy,cw,h,12);c.stroke();c.setLineDash([]);
        di('brush',sx+sw/2-22,cy+h/2-22,44)}
      cy+=h+14;
    }
  }
  c.restore();
  c.textAlign='center';c.font=`600 20px ${FONT}`;c.fillStyle=mute;
  c.fillText(sketchMode?'직접 그린 화면':'화면 설계',px+pw/2,py+ph+28);

  // 작동 규칙 (전체 폭)
  y=Math.max(leftEnd,py+ph+50)+20;
  if(rules.length){
    head('HOW IT WORKS','작동 규칙');
    rules.forEach((r,i)=>{
      const h=64;
      c.fillStyle='#fef3c7';rr(c,84,y-6,420,h,12);c.fill();c.strokeStyle='#f59e0b';c.lineWidth=2;rr(c,84,y-6,420,h,12);c.stroke();
      c.textAlign='left';c.font=`800 20px ${FONT}`;c.fillStyle='#b45309';c.fillText('언제',104,y+26);
      c.font=`600 25px ${FONT}`;c.fillStyle=ink;c.fillText(fit(c,r.when.trim(),330),164,y+26);
      di('arrow',522,y+12,30);
      c.fillStyle='#ede9fe';rr(c,568,y-6,428,h,12);c.fill();c.strokeStyle='#8b5cf6';c.lineWidth=2;rr(c,568,y-6,428,h,12);c.stroke();
      c.font=`800 20px ${FONT}`;c.fillStyle='#6d28d9';c.fillText('그러면',588,y+26);
      c.font=`600 25px ${FONT}`;c.fillStyle=ink;c.fillText(fit(c,r.then.trim(),320),664,y+26);
      y+=h+14});
    y+=26;
  }
  // 셀프 체크
  head('CHECK','셀프 체크');
  c.font=`600 22px ${FONT}`;
  CHECKS.forEach((tx,i)=>{
    const x=84+(i%2)*464,yy=y+Math.floor(i/2)*44;
    if(S.checks[i]){c.fillStyle='#059669';rr(c,x,yy-14,28,28,7);c.fill();di('chk',x+5,yy-9,18)}
    else{c.strokeStyle='#cbd5e1';c.lineWidth=2.5;rr(c,x,yy-14,28,28,7);c.stroke()}
    c.textAlign='left';c.fillStyle=S.checks[i]?ink:mute;c.fillText(fit(c,tx,410),x+42,yy)});
  y+=88;
  const contentEnd=y;

  // 최종 합성
  const cardBottom=contentEnd+70,H=cardBottom+40;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const f=cv.getContext('2d');f.textBaseline='middle';
  f.fillStyle='#f1f5f9';f.fillRect(0,0,W,H);
  f.fillStyle=ink;f.fillRect(0,0,W,280);
  f.fillStyle=pri;rr(f,64,52,44,44,11);f.fill();
  f.fillStyle='#fff';[[0,0],[1,0],[0,1],[1,1]].forEach(([a,b])=>{rr(f,73+a*14,61+b*14,11,11,2.5);f.fill()});
  f.textAlign='left';f.fillStyle='#fff';f.font=`800 28px ${FONT}`;f.fillText('APP STUDIO',124,66);
  f.fillStyle=mute;f.font=`500 20px ${FONT}`;f.fillText('앱 기획서 · 버전 1.0',124,92);
  f.textAlign='right';f.fillStyle='#fff';f.font=`700 26px ${FONT}`;f.fillText(fit(f,`개발자 ${S.nick.trim()}`,420),W-64,80);
  f.save();f.shadowColor='rgba(15,23,42,.10)';f.shadowBlur=30;f.shadowOffsetY=8;
  f.fillStyle='#fff';rr(f,40,140,W-80,cardBottom-140,32);f.fill();f.restore();
  f.drawImage(cc,0,0);
  f.textAlign='left';f.font=`500 21px ${FONT}`;f.fillStyle=mute;f.fillText(new Date().toLocaleDateString('ko-KR'),84,cardBottom-42);
  f.textAlign='right';f.fillText('APP STUDIO · 앱 기획서',W-84,cardBottom-42);
  planCanvas=cv;
  const img=$('#planImg');if(img)img.src=cv.toDataURL('image/png');
}

async function savePng(){
  await drawPlan();
  if(!planCanvas)return;
  const clean=s=>s.replace(/[\\/:*?"<>|\s]/g,'');
  const name=`앱기획서_${clean(S.appName.trim()||'내앱')}_${clean(S.nick.trim())}.png`;
  const done=url=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('저장했어요. 이제 패들렛에 올려 주세요')};
  try{
    if(planCanvas.toBlob){planCanvas.toBlob(b=>{if(!b){done(planCanvas.toDataURL('image/png'));return}
      const u=URL.createObjectURL(b);done(u);setTimeout(()=>URL.revokeObjectURL(u),4000)},'image/png')}
    else done(planCanvas.toDataURL('image/png'));
  }catch(e){toast('기획서 그림을 길게 눌러 저장해 주세요')}
}

render();
</script>
